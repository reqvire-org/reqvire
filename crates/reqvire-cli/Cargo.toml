[package]
name = "reqvire-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[[bin]]
name = "reqvire"
path = "src/main.rs"

[package.metadata.dist]
dist = true
npm-scope = "@reqvire-org"
npm-package = "reqvire"

[lints]
workspace = true

[dependencies]
reqvire = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }

# File handling
globset = { workspace = true }
rustc-hash = { workspace = true }
ignore = "0.4"

tempfile = { workspace = true }

# HTTP server
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
percent-encoding = { workspace = true }
rmcp = { version = "1.8.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }

[dev-dependencies]
assert_fs = { workspace = true }
predicates = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
