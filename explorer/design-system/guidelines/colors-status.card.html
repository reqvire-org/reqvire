<!-- @dsCard group="Colors" viewport="700x110" name="Status colors" subtitle="Feedback states — success, warning, danger, info" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-canvas);color:var(--text-body);padding:18px 20px;}
  .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}
  
</style></head>
<body><div style="display:flex;gap:12px;"><div style="flex:1;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--success) 12%,transparent);">
     <span style="width:14px;height:14px;border-radius:50%;background:var(--success);"></span>
     <span style="font-size:13px;font-weight:600;color:color-mix(in srgb,var(--success) 75%,var(--text-strong));">Success</span></div><div style="flex:1;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--warning) 12%,transparent);">
     <span style="width:14px;height:14px;border-radius:50%;background:var(--warning);"></span>
     <span style="font-size:13px;font-weight:600;color:color-mix(in srgb,var(--warning) 75%,var(--text-strong));">Warning</span></div><div style="flex:1;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--danger) 12%,transparent);">
     <span style="width:14px;height:14px;border-radius:50%;background:var(--danger);"></span>
     <span style="font-size:13px;font-weight:600;color:color-mix(in srgb,var(--danger) 75%,var(--text-strong));">Danger</span></div><div style="flex:1;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--info) 12%,transparent);">
     <span style="width:14px;height:14px;border-radius:50%;background:var(--info);"></span>
     <span style="font-size:13px;font-weight:600;color:color-mix(in srgb,var(--info) 75%,var(--text-strong));">Info</span></div></div></body></html>
