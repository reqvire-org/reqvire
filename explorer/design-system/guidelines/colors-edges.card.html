<!-- @dsCard group="Colors" viewport="700x150" name="Graph edges & overlays" subtitle="Relation overlays drawn between nodes on the canvas" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-canvas);color:var(--text-body);padding:18px 20px;}
  .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}
  
</style></head>
<body><div style="display:flex;flex-direction:column;gap:11px;"><div style="display:flex;align-items:center;gap:14px;">
     <span style="width:64px;border-top:3px solid var(--edge-derive);"></span>
     <span style="font-size:13px;color:var(--text-body);" class="mono">derivedFrom</span></div><div style="display:flex;align-items:center;gap:14px;">
     <span style="width:64px;border-top:3px solid var(--edge-satisfy);"></span>
     <span style="font-size:13px;color:var(--text-body);" class="mono">verify / satisfy</span></div><div style="display:flex;align-items:center;gap:14px;">
     <span style="width:64px;border-top:3px solid var(--edge-attach);"></span>
     <span style="font-size:13px;color:var(--text-body);" class="mono">attachments</span></div><div style="display:flex;align-items:center;gap:14px;">
     <span style="width:64px;border-top:2px dashed var(--edge-trace);"></span>
     <span style="font-size:13px;color:var(--text-body);" class="mono">trace</span></div><div style="display:flex;align-items:center;gap:14px;">
     <span style="width:64px;border-top:3px solid var(--edge-default);"></span>
     <span style="font-size:13px;color:var(--text-body);" class="mono">default</span></div></div></body></html>
