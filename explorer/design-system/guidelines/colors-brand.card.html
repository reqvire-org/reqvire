<!DOCTYPE html>

</style></head>
<body><div style="display:flex;gap:6px;"><div style="flex:1;"><div style="height:54px;border-radius:7px;background:var(--rose-50);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);"></div>
