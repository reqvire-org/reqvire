<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-canvas);color:var(--text-body);padding:18px 20px;}
  .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}
  
</style></head>
<body><div style="display:flex;gap:10px;"><div style="flex:1;"><div style="height:60px;border-radius:8px;background:var(--capability);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></div>
     <div style="margin-top:7px;font-size:12px;font-weight:600;color:var(--text-body);">Capability</div>
     <div class="t mono">#BBDEFB</div></div><div style="flex:1;"><div style="height:60px;border-radius:8px;background:var(--requirement);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></div>
     <div style="margin-top:7px;font-size:12px;font-weight:600;color:var(--text-body);">Requirement</div>
     <div class="t mono">#673AB7</div></div><div style="flex:1;"><div style="height:60px;border-radius:8px;background:var(--refinement);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></div>
     <div style="margin-top:7px;font-size:12px;font-weight:600;color:var(--text-body);">Refinement</div>
     <div class="t mono">#FF9800</div></div><div style="flex:1;"><div style="height:60px;border-radius:8px;background:var(--verification);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></div>
     <div style="margin-top:7px;font-size:12px;font-weight:600;color:var(--text-body);">Verification</div>
     <div class="t mono">#4CAF50</div></div><div style="flex:1;"><div style="height:60px;border-radius:8px;background:var(--ontology);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></div>
     <div style="margin-top:7px;font-size:12px;font-weight:600;color:var(--text-body);">Ontology</div>
     <div class="t mono">#B08A00</div></div><div style="flex:1;"><div style="height:60px;border-radius:8px;background:var(--resource);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></div>
     <div style="margin-top:7px;font-size:12px;font-weight:600;color:var(--text-body);">Resource</div>
     <div class="t mono">#FFCA28</div></div><div style="flex:1;"><div style="height:60px;border-radius:8px;background:var(--other);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);"></div>
     <div style="margin-top:7px;font-size:12px;font-weight:600;color:var(--text-body);">Other</div>
     <div class="t mono">#9E9E9E</div></div></div>
   <div style="margin-top:11px;font-size:11px;color:var(--text-faint);">Ontology nodes fill pale <span class="mono">#F4E3A1</span> with a <span class="mono">#B08A00</span> stroke · file / report items use <span class="mono">#FFCA28</span></div></body></html>
