<!-- @dsCard group="Spacing" viewport="700x140" name="Corner radii" subtitle="Type-icon chips → cards → dialogs → pills" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-canvas);color:var(--text-body);padding:18px 20px;}
  .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}
  
</style></head>
<body><div style="display:flex;gap:14px;align-items:flex-end;"><div style="text-align:center;"><div style="width:58px;height:46px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;box-shadow:var(--shadow-xs);"></div>
     <div class="t" style="margin-top:7px;">xs</div><div class="mono" style="font-size:10px;color:var(--text-faint);">4px</div></div><div style="text-align:center;"><div style="width:58px;height:46px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-xs);"></div>
     <div class="t" style="margin-top:7px;">sm</div><div class="mono" style="font-size:10px;color:var(--text-faint);">6px</div></div><div style="text-align:center;"><div style="width:58px;height:46px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-xs);"></div>
     <div class="t" style="margin-top:7px;">md</div><div class="mono" style="font-size:10px;color:var(--text-faint);">8px</div></div><div style="text-align:center;"><div style="width:58px;height:46px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:10px;box-shadow:var(--shadow-xs);"></div>
     <div class="t" style="margin-top:7px;">lg</div><div class="mono" style="font-size:10px;color:var(--text-faint);">10px</div></div><div style="text-align:center;"><div style="width:58px;height:46px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;box-shadow:var(--shadow-xs);"></div>
     <div class="t" style="margin-top:7px;">xl</div><div class="mono" style="font-size:10px;color:var(--text-faint);">14px</div></div><div style="text-align:center;"><div style="width:58px;height:46px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:20px;box-shadow:var(--shadow-xs);"></div>
     <div class="t" style="margin-top:7px;">2xl</div><div class="mono" style="font-size:10px;color:var(--text-faint);">20px</div></div><div style="text-align:center;"><div style="width:58px;height:46px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:999px;box-shadow:var(--shadow-xs);"></div>
     <div class="t" style="margin-top:7px;">pill</div><div class="mono" style="font-size:10px;color:var(--text-faint);">999px</div></div></div></body></html>
