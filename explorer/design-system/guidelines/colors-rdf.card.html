<!-- @dsCard group="Colors" viewport="700x140" name="Ontology graph palette" subtitle="RDF / SHACL node colors for the Ontologies explorer" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-canvas);color:var(--text-body);padding:18px 20px;}
  .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}
  
</style></head>
<body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:11px 14px;"><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-class);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Class</span></div><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-objprop);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Object prop</span></div><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-dtprop);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Datatype prop</span></div><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-individual);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Individual</span></div><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-datatype);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Datatype</span></div><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-nodeshape);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Node shape</span></div><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-propshape);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Property shape</span></div><div style="display:flex;align-items:center;gap:8px;"><span style="width:13px;height:13px;border-radius:50%;background:var(--rdf-resource);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></span>
     <span style="font-size:12px;color:var(--text-secondary);">Resource</span></div></div></body></html>
