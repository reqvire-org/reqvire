<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 0; }
  .head { background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 0 18px; display:flex; align-items:center; gap: 18px; }
  .body { padding: 20px 22px; display: flex; gap: 26px; }
  .lbl { font-size: var(--text-micro); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 9px; }
  .col { display: flex; flex-direction: column; gap: 9px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, ToggleRow, SegmentedControl, SearchInput, Icon } = window.ReqvireExplorerDesignSystem_48409e;
const { useState } = React;
const TABS = [
  { value:'model', label:'Model', icon:<Icon name="folder" size={15}/> },
  { value:'graph', label:'Knowledge Graph', icon:<Icon name="network" size={15}/> },
  { value:'ontologies', label:'Ontologies', icon:<Icon name="globe" size={15}/> },
  { value:'search', label:'Search', icon:<Icon name="search" size={15}/> },
  { value:'traces', label:'Traces', icon:<Icon name="activity" size={15}/>, badge:145 },
];
const LEGEND = [
  ['Capability','var(--capability)',86],['Requirement','var(--requirement)',420],
  ['Refinement','var(--refinement)',64],['Verification','var(--verification)',145],
];
function Demo() {
  const [mode,setMode] = useState('graph');
  const [view,setView] = useState('grid');
  const [on,setOn] = useState({Capability:true,Requirement:true,Refinement:false,Verification:true});
  return (
    <div>
      <div className="head"><Tabs items={TABS} value={mode} onChange={setMode} /></div>
      <div className="body">
        <div style={{width:230}}>
          <div className="lbl">Show</div>
          <div className="col">
            {LEGEND.map(([l,c,n]) => <ToggleRow key={l} label={l} color={c} meta={n} on={on[l]} onToggle={()=>setOn(s=>({...s,[l]:!s[l]}))} />)}
          </div>
        </div>
        <div style={{flex:1}}>
          <div className="lbl">View switch</div>
          <SegmentedControl value={view} onChange={setView} items={[
            {value:'list',label:'List',icon:<Icon name="list" size={14}/>},
            {value:'grid',label:'Grid',icon:<Icon name="grid" size={14}/>},
          ]} />
          <div className="lbl" style={{marginTop:22}}>Search</div>
          <SearchInput placeholder="Search ontology graph…" />
          <div style={{height:10}}></div>
          <SearchInput size="lg" placeholder="Search elements, files, resources…" kbd="/" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
