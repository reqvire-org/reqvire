<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 22px; }
  .wrap { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font-size: var(--text-micro); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); width: 78px; flex: none; }
  .sep { height: 1px; background: var(--border-subtle); margin: 2px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.ReqvireExplorerDesignSystem_48409e;
const {
  ElementIcon,
  TypeBadge,
  RelationPill,
  Chip,
  Stat,
  StatRow,
  Icon,
  TableViewport,
  Table,
  TableHeader,
  TableBody,
  TableRow,
  TableHead,
  TableCell,
  TableSortButton,
} = NS;
const types = ["capability","requirement","refinement","verification","specification","semantic-contract","ontology","resource"];

function Demo() {
  return (
    <div className="wrap">
      <div className="row">
        <span className="lbl">Type glyph</span>
        <div className="row">{types.map(t => <ElementIcon key={t} type={t} size="lg" />)}</div>
      </div>
      <div className="row">
        <span className="lbl">Type slug</span>
        <div className="row">{types.map(t => <TypeBadge key={t} type={t} />)}</div>
      </div>
      <div className="row">
        <span className="lbl">Tinted</span>
        <div className="row">{["capability","requirement","verification","refinement"].map(t => <TypeBadge key={t} type={t} tinted />)}</div>
      </div>
      <div className="sep"></div>
      <div className="row">
        <span className="lbl">Relations</span>
        <div className="wrap" style={{ gap: 8 }}>
          <RelationPill kind="specifiedBy" target="Git Repository as Project Root" type="specification" />
          <RelationPill kind="verifiedBy" target="CLI Search Command Test" type="verification" />
        </div>
      </div>
      <div className="row">
        <span className="lbl">Facets</span>
        <div className="row">
          <Chip icon={<Icon name="folder" size={13} />}>folder</Chip>
          <Chip icon={<Icon name="file" size={13} />}>source file</Chip>
          <Chip icon={<Icon name="box" size={13} />} active>modeled element</Chip>
        </div>
      </div>
      <div className="row">
        <span className="lbl">Summary</span>
        <StatRow>
          <Stat label="Submodels" value={13} />
          <Stat label="Elements" value={640} />
          <Stat label="Relations" value={1090} />
          <Stat label="Attachments" value={248} />
        </StatRow>
      </div>
      <div className="row" style={{ alignItems: "flex-start" }}>
        <span className="lbl">Table</span>
        <TableViewport style={{ width: 520 }}>
          <Table>
            <TableHeader>
              <TableRow>
                <TableHead><TableSortButton direction="asc">Name</TableSortButton></TableHead>
                <TableHead>Type</TableHead>
                <TableHead>Elements</TableHead>
              </TableRow>
            </TableHeader>
            <TableBody>
              <TableRow selected>
                <TableCell>Requirements.md</TableCell>
                <TableCell><TypeBadge type="resource">source file</TypeBadge></TableCell>
                <TableCell>6</TableCell>
              </TableRow>
              <TableRow>
                <TableCell>Verification.md</TableCell>
                <TableCell><TypeBadge type="resource">source file</TypeBadge></TableCell>
                <TableCell>2</TableCell>
              </TableRow>
            </TableBody>
          </Table>
        </TableViewport>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
