<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reqvire Explorer</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="mask-icon" href="assets/logo-mark.svg" color="#e11d48" />
    <meta name="application-name" content="Reqvire Explorer" />
    <meta name="apple-mobile-web-app-title" content="Reqvire" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="assets/mstile-150x150.png" />
    <meta name="msapplication-config" content="assets/browserconfig.xml" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        overflow: hidden;
      }
    </style>
    <script>
      (() => {
        const key = "reqvire-explorer-theme";
        const stored = localStorage.getItem(key);
        const dark = stored === "dark" || (!stored && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
