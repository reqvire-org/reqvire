name: Deploy Explorer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Explorer dependencies
        run: cd explorer && npm ci

      - name: Build Explorer SPA bundle
        run: cd explorer && npm run build

      - name: Build Reqvire binary
        env:
          REQVIRE_BUILD_EXPLORER: "1"
        run: cargo build --release --locked

      - name: Export Explorer site
        run: ./target/release/reqvire export --output ./site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
