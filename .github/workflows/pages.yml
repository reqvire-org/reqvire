name: Deploy Explorer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/reqvire-browser" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node for the Vite application build
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Explorer dependencies
        run: cd explorer && bun install --frozen-lockfile

      - name: Install headless Chromium for Explorer checks
        run: cd explorer && bun --bun x --no-install playwright install --with-deps chromium --only-shell

      - name: Build Explorer SPA bundle
        run: cd explorer && bun run build

      - name: Build Reqvire binary
        run: cargo build --release --locked

      - name: Export Explorer site
        run: ./target/release/reqvire export --output ./site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
