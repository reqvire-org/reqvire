name: Rust Tests on PR

on:
  pull_request:
    branches:
      - main  # Change this to match your default branch

jobs:
  test:
    name: Run Rust Tests
    runs-on: ubuntu-latest  # Runs on an Ubuntu machine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Explorer dependencies
        run: cd explorer && npm ci

      - name: Lint Explorer SPA
        run: cd explorer && npm run lint

      - name: Build Explorer SPA bundle
        # core/build.rs embeds explorer/dist into the binary at compile time,
        # so the bundle must be built before cargo build/test.
        run: cd explorer && npm run build

      - name: Run Tests
        run: cargo test --verbose

  validate:
    name: Validate Requirements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        
      - name: Install Reqvire
        run: curl -fsSL https://raw.githubusercontent.com/ilijaljubicic/Reqvire/main/scripts/install.sh | bash
                
      - name: Validate Requirements via validate command
        id: validate
        continue-on-error: true
        run: |
          mkdir -p reports
          reqvire validate | tee reports/validation_report.txt

      - name: Upload Validation Report if validation failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reqvire-validation-report
          path: reports/validation_report.txt          
