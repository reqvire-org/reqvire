name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: read # this can be 'read' if the signatures are in remote repository
  issues: write
  pull-requests: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the below token should have repo scope and must be manually added by you in the repository's secret
          # This token is required only if you have configured to store the signatures in a remote repository/organization
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/reqvire-org/reqvire/blob/main/doc/CLA.md'
          # branch should not be protected
          branch: 'main'
          allowlist: ''

         # the followings are the optional inputs - If the optional inputs are not given, then default values will be taken
          remote-organization-name: reqvire-org
          remote-repository-name: reqvire-cla
          #create-file-commit-message: 'For example: Creating file for storing CLA Signatures'
          signed-commit-message: '$contributorName signed the Reqvire CLA for $owner/$repo#$pullRequestNo'
          custom-notsigned-prcomment: 'Thank you for contributing to Reqvire. Before this pull request can be merged, each contributor must read the [Reqvire CLA](https://github.com/reqvire-org/reqvire/blob/main/doc/CLA.md). To sign, add this exact pull request comment: I have read the CLA Document and I hereby sign the CLA'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All pull request contributors have signed the Reqvire CLA.'
          lock-pullrequest-aftermerge: true
          use-dco-flag: false
          suggest-recheck: false
