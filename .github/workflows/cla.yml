name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "Reqvire CLA"
        uses: actions/github-script@v8
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const SIGNATURE_TEXT = 'I have read the CLA Document and I hereby sign the CLA';
            const CLA_DOCUMENT_URL = 'https://github.com/reqvire-org/reqvire/blob/main/doc/CLA.md';
            const SIGNATURE_OWNER = 'reqvire-org';
            const SIGNATURE_REPO = 'reqvire-cla';
            const SIGNATURE_BRANCH = 'main';
            const SIGNATURE_PATH = 'signatures/version1/cla.json';
            const STATUS_CONTEXT = 'Reqvire CLA';
            const COMMENT_MARKER = '<!-- reqvire-cla-assistant -->';
            const BOT_COMMENT_FOOTER = '\n\nPosted by the **Reqvire CLA bot**.\n' + COMMENT_MARKER;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const action = context.payload.action;
            const pat = process.env.PERSONAL_ACCESS_TOKEN;

            if (eventName === 'issue_comment' && context.payload.comment.body !== SIGNATURE_TEXT) {
              core.info('Ignoring non-signature comment.');
              return;
            }

            if (eventName === 'pull_request_target' && action === 'closed') {
              if (context.payload.pull_request?.merged) {
                await github.rest.issues.lock({
                  owner,
                  repo,
                  issue_number: context.payload.pull_request.number,
                  lock_reason: 'resolved',
                });
              }
              return;
            }

            if (!pat) {
              core.setFailed('PERSONAL_ACCESS_TOKEN is required to read and write the private CLA signature repository.');
              return;
            }

            const pullRequest = await resolvePullRequest();
            if (!pullRequest) {
              core.info('No pull request found for this event.');
              return;
            }

            const pullNumber = pullRequest.number;
            const headSha = pullRequest.head.sha;
            const contributors = await listPullRequestContributors(pullNumber);
            const contributorKeys = new Set(contributors.flatMap(contributorKeysFor));
            const signatureFile = await readSignatureFile();
            const signedContributors = normalizeSignedContributors(signatureFile.content.signedContributors || []);

            if (eventName === 'issue_comment') {
              await acknowledgeSigningComment();

              const commenter = context.payload.comment.user;
              const commenterRecord = {
                name: commenter.login,
                id: commenter.id,
                pullRequestNo: pullNumber,
                signedAt: context.payload.comment.created_at,
              };

              if (!contributorKeys.has(contributorKey(commenterRecord))) {
                core.warning(`@${commenter.login} is not a current contributor on PR #${pullNumber}; not recording a CLA signature.`);
              } else if (isSigned(signedContributors, commenterRecord)) {
                core.info(`@${commenter.login} already has a CLA signature; not writing a duplicate.`);
              } else {
                signedContributors.push(commenterRecord);
                await writeSignatureFile(signatureFile.sha, {
                  ...signatureFile.content,
                  signedContributors,
                }, `@${commenter.login} signed the Reqvire CLA for ${owner}/${repo}#${pullNumber}`);
              }
            }

            const signedKeys = new Set(signedContributors.flatMap(contributorKeysFor));
            const missing = contributors.filter((contributor) => !contributorKeysFor(contributor).some((key) => signedKeys.has(key)));
            const allSigned = missing.length === 0;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: allSigned ? 'success' : 'failure',
              context: STATUS_CONTEXT,
              description: allSigned
                ? 'All pull request contributors have signed the Reqvire CLA.'
                : `${missing.length} contributor(s) must sign the Reqvire CLA.`,
              target_url: `${context.payload.repository.html_url}/pull/${pullNumber}`,
            });

            await upsertClaComment(pullNumber, allSigned, missing);

            if (!allSigned) {
              core.setFailed(`Missing Reqvire CLA signatures: ${missing.map((contributor) => '@' + contributor.name).join(', ')}`);
            }

            async function resolvePullRequest() {
              if (eventName === 'pull_request_target') {
                return context.payload.pull_request;
              }

              const issueNumber = context.payload.issue?.number;
              if (!issueNumber || !context.payload.issue?.pull_request) {
                return null;
              }

              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issueNumber,
              });
              return response.data;
            }

            async function listPullRequestContributors(pullNumber) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              const contributorsByKey = new Map();

              for (const commit of commits) {
                const user = commit.author || commit.committer;
                if (!user || user.type === 'Bot' || user.id === 41898282) {
                  continue;
                }
                const contributor = {
                  name: user.login,
                  id: user.id,
                  pullRequestNo: pullNumber,
                };
                contributorsByKey.set(contributorKey(contributor), contributor);
              }

              return Array.from(contributorsByKey.values()).sort((left, right) => left.name.localeCompare(right.name));
            }

            async function readSignatureFile() {
              try {
                const response = await requestSignatureRepo(
                  'GET',
                  `/repos/${SIGNATURE_OWNER}/${SIGNATURE_REPO}/contents/${SIGNATURE_PATH}?ref=${encodeURIComponent(SIGNATURE_BRANCH)}`
                );

                if (Array.isArray(response)) {
                  throw new Error(`${SIGNATURE_PATH} resolves to a directory, expected JSON file.`);
                }

                const content = Buffer.from(response.content, response.encoding).toString('utf8');
                return {
                  sha: response.sha,
                  content: JSON.parse(content),
                };
              } catch (error) {
                if (error.status === 404) {
                  return {
                    sha: null,
                    content: { signedContributors: [] },
                  };
                }
                throw error;
              }
            }

            async function writeSignatureFile(sha, content, message) {
              const payload = {
                message,
                content: Buffer.from(JSON.stringify(content, null, 2) + '\n').toString('base64'),
                branch: SIGNATURE_BRANCH,
              };

              if (sha) {
                payload.sha = sha;
              }

              await requestSignatureRepo(
                'PUT',
                `/repos/${SIGNATURE_OWNER}/${SIGNATURE_REPO}/contents/${SIGNATURE_PATH}`,
                payload
              );
            }

            async function requestSignatureRepo(method, path, body) {
              const response = await fetch(`https://api.github.com${path}`, {
                method,
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${pat}`,
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
                body: body ? JSON.stringify(body) : undefined,
              });

              if (response.status === 204) {
                return null;
              }

              const text = await response.text();
              const data = text ? JSON.parse(text) : null;

              if (!response.ok) {
                const error = new Error(data?.message || `GitHub API request failed: ${method} ${path}`);
                error.status = response.status;
                throw error;
              }

              return data;
            }

            function normalizeSignedContributors(contributors) {
              const byKey = new Map();
              for (const contributor of contributors) {
                const key = contributorKey(contributor);
                if (!byKey.has(key)) {
                  byKey.set(key, contributor);
                }
              }
              return Array.from(byKey.values());
            }

            function isSigned(signedContributors, contributor) {
              const keys = contributorKeysFor(contributor);
              return signedContributors.some((signed) => contributorKeysFor(signed).some((key) => keys.includes(key)));
            }

            function contributorKeysFor(contributor) {
              return [contributorKey(contributor), contributorNameKey(contributor)].filter(Boolean);
            }

            function contributorKey(contributor) {
              return contributor.id ? `id:${contributor.id}` : contributorNameKey(contributor);
            }

            function contributorNameKey(contributor) {
              return contributor.name ? `name:${String(contributor.name).toLowerCase()}` : '';
            }

            async function acknowledgeSigningComment() {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: context.payload.comment.id,
                  content: '+1',
                });
              } catch (error) {
                if (error.status === 403) {
                  core.warning(`Could not add acknowledgement reaction to signing comment: ${error.message}`);
                } else if (error.status !== 422) {
                  throw error;
                }
              }
            }

            async function upsertClaComment(pullNumber, allSigned, missing) {
              const body = allSigned
                ? `All pull request contributors have signed the Reqvire CLA.${BOT_COMMENT_FOOTER}`
                : [
                    `Thank you for contributing to Reqvire. Before this pull request can be merged, each contributor must read the [Reqvire CLA](${CLA_DOCUMENT_URL}).`,
                    '',
                    'Missing signatures:',
                    ...missing.map((contributor) => `- @${contributor.name}`),
                    '',
                    'To sign, each missing contributor must add this exact pull request comment:',
                    '',
                    '`' + SIGNATURE_TEXT + '`',
                    BOT_COMMENT_FOOTER,
                  ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const existing = comments
                .filter((comment) =>
                  comment.body?.includes(COMMENT_MARKER) ||
                  comment.body?.includes('CLA Assistant Lite bot') ||
                  comment.body?.includes('Before this pull request can be merged, each contributor must read the [Reqvire CLA]')
                )
                .sort((left, right) => new Date(right.updated_at) - new Date(left.updated_at))[0];

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullNumber,
                  body,
                });
              }
            }
