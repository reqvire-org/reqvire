name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Reqvire
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Reproducible bugs are the most useful external contribution to Reqvire right now.
        Public pull requests are not open at the moment. Please use this form for reproducible bug reports and detailed analysis.

  - type: dropdown
    id: component
    attributes:
      label: Affected Area
      description: Which Reqvire capability or interface is affected?
      multiple: true
      options:
        - CLI command
        - Model parsing or formatting
        - Model mutation commands
        - Validation or linting
        - Search, coverage, traces, change impact, resources, or submodels report
        - Ontologies, semantic contracts, SHACL, RDF export, or SPARQL
        - MCP server, MCP tools, or MCP prompts
        - Explorer UI, exported Explorer, or serve command
        - Codex or Claude assistant skills/plugins
        - Installation, packaging, release, or documentation website
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Include the exact command, Explorer action, MCP request, or model workflow that triggers the behavior.
      placeholder: |
        1. Run `reqvire ...`
        2. Or open Explorer at `...` and click `...`
        3. Or call MCP tool/prompt `...` with arguments `...`
        4. See `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide the details that apply. Delete lines that are not relevant.
      placeholder: |
        - OS:
        - Reqvire version: output of `reqvire --version` or `npx -y @reqvire-org/reqvire@latest --version`
        - Install/run method: npm, binary, cargo, source checkout, Docker, other
        - Node/npm version, if using npm or Explorer tooling:
        - Browser, if Explorer UI/export/serve issue:
        - MCP client and server URL, if MCP issue:
        - Git version, if change-impact or repository workflow issue:
    validations:
      required: true

  - type: textarea
    id: model
    attributes:
      label: Relevant Model or Workspace Details
      description: Share the smallest model/workspace snippet needed to reproduce. Remove private information.
      render: markdown
      placeholder: |
        - Relevant files under `system-model/...`:
        - Relevant element identifiers:
        - Relevant relations, concept references, semantic contracts, or ontology prefixes:

        ```markdown
        # Minimal model snippet, if useful
        ```

  - type: textarea
    id: mcp
    attributes:
      label: MCP Details
      description: For MCP bugs, include the tool/prompt/resource name, arguments, and response shape. Remove sensitive information.
      render: json
      placeholder: |
        {
          "server": "http://127.0.0.1:8081/mcp",
          "tool_or_prompt": "reqvire.semantic.sparql",
          "arguments": {}
        }

  - type: textarea
    id: explorer
    attributes:
      label: Explorer or Browser Details
      description: For Explorer bugs, include URL/hash route, console errors, network errors, and screenshots if useful.
      placeholder: |
        - URL/hash route:
        - Console errors:
        - Network errors:
        - Screenshot or screen recording:

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Command Output
      description: If applicable, add error messages, command output, validation diagnostics, browser console output, or MCP responses.
      render: shell
      placeholder: Paste error messages or logs here...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, links, etc.)
      placeholder: Any additional information that might help...

  - type: textarea
    id: hypothesis
    attributes:
      label: Root-Cause Hypothesis
      description: If you have a hypothesis about why this happens, share it here.
      placeholder: Potential root cause, impacted modules, or suspected regression source...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I understand public pull requests are not open at the moment
          required: true
