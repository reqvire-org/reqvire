[workspace]
members = [
    "crates/reqvire-core",
    "crates/reqvire-cli",
    "crates/o-kernel",
]
resolver = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
clone_on_ref_ptr = "warn"

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
authors = ["Ilija Ljubicic <iliya.ljubicic@gmail.com>"]
description = "Semantic engineering graph for building verifiable and traceable systems."
repository = "https://github.com/reqvire-org/Reqvire"
homepage = "https://www.reqvire.org"
documentation = "https://github.com/reqvire-org/Reqvire#readme"

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
pulldown-cmark = "0.13"
regex = "1.9"
camino = "1.1"
maud = "0.27"
thiserror = "2.0"
walkdir = "2.4"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pathdiff = "0.2"
termcolor = "1.4"
globset = "0.4.16"
rustc-hash = "2.1"
difference = "2.0"
oxigraph = { version = "0.5.8", default-features = false }
o-kernel = { path = "crates/o-kernel" }
reqvire = { path = "crates/reqvire-core" }
tiny_http = "0.12"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "sync"] }
axum = "0.8.4"
tower-http = { version = "0.6.6", features = ["fs"] }
percent-encoding = "2.3"


# dev dependencies
assert_fs   = "1.0"
predicates  = "3.0"
tempfile    = "3.8"
serial_test = "3.2"
